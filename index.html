<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de clientes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-principal">
    <nav class="menu-navegacao">
        <a href="index.html">Home</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="clientes.html">Clientes</a>
    </nav>

    <main class="conteudo-principal">
        <img src="assets/logo.avif" alt="Logo da empresa" class="logo">

        <h1 class="titulo-animado">Bem-vindo ao Sistema de Clientes</h1>
        <p>
            Este é um sistema para cadastrar seus clientes.
        </p>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const titulo = document.querySelector('.titulo-animado')

            if (!titulo) {
                return
            }

            const texto = titulo.textContent
            titulo.textContent = ''

            [...texto].forEach((caractere, indice) => {
                const span = document.createElement('span')
                span.className = 'char'
                span.style.setProperty('--i', indice)
                span.textContent = caractere === ' ' ? '\u00A0' : caractere
                titulo.appendChild(span)
            })
        })
    </script>
</body>
</html>
