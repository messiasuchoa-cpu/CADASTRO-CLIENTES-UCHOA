<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de clientes</title>
  <link rel="stylesheet" href="cadastro.css">
</head>

<body class="pagina-cadastro">
  <nav class="menu-navegacao">
    <a href="index.html">Home</a>
    <a href="cadastro.html">Cadastro</a>
    <a href="clientes.html">Clientes</a>
  </nav>

  <main class="conteudo-principal">
    <img src="assets/logo.avif" alt="Logo da empresa" class="logo">

    <h2 class="titulo-animado">Cadastro de clientes</h2>

    <form id="formulario-cadastro">
      <input type="text" id="nome" placeholder="Ex.: Maria" required>
      <input type="email" id="email" placeholder="Ex.: maria@email.com" required>
      <input type="tel" id="telefone" placeholder="Ex.: 71 90000-0000" required>
      <button type="submit">Cadastrar</button>
    </form>
  </main>

  <script src="cadastro.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const titulo = document.querySelector('.titulo-animado')

      if (!titulo) {
        return
      }

      const texto = titulo.textContent
      titulo.textContent = ''

      [...texto].forEach((caractere, indice) => {
        const span = document.createElement('span')
        span.className = 'char'
        span.style.setProperty('--i', indice)
        span.textContent = caractere === ' ' ? '\u00A0' : caractere
        titulo.appendChild(span)
      })
    })
  </script>
</body>

</html>
